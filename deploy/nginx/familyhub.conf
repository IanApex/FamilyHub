# nginx server block for FamilyHub.
#
# Install as /etc/nginx/sites-available/familyhub, symlink into sites-enabled,
# and replace familyhub.example.com with your domain throughout.
#
# Run certbot --nginx after the port 80 block is live; it fills in the
# ssl_certificate paths referenced below.

server {
    listen 80;
    listen [::]:80;
    server_name familyhub.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # On nginx < 1.25.1 drop this line and use `listen 443 ssl http2;` above.
    http2 on;

    server_name familyhub.example.com;

    ssl_certificate     /etc/letsencrypt/live/familyhub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/familyhub.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/familyhub;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml application/manifest+json;

    # Recipe import posts URLs, not files; raise only if you add photo uploads.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache rules below use `expires` rather than `add_header Cache-Control`
    # on purpose: an add_header inside a location discards every add_header
    # inherited from the server block, silently dropping the security headers.

    # Hashed filenames — safe to cache for a year.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # The service worker and entry document must always be revalidated, or
    # clients pin themselves to a stale build and never see updates.
    location = /sw.js {
        expires epoch;
    }

    location = /index.html {
        expires epoch;
    }

    location = /manifest.webmanifest {
        expires epoch;
    }

    # SPA fallback. Required for real paths like /settings, which the Google
    # OAuth flow redirects back to.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
