name: familyhub

# Self-hosted stack for a machine exposed with Tailscale Funnel.
#
# Only `web` publishes a port, and only on loopback. Tailscale runs on the
# Windows host (not in Docker) and proxies the public HTTPS URL to it, so the
# router needs no forwarded ports and nothing is reachable from the LAN.
#
# Bring the public URL up with:  tailscale funnel --bg 8081

services:
  api:
    image: ghcr.io/joe-bor/family-hub-api:${BE_IMAGE_TAG:-1.9.0}
    restart: unless-stopped
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    # Loopback only. 8081 avoids the dev backend on 8080 and Vite on 5173.
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The built frontend. Run `npm run build` in the repo root to refresh it.
      - ../../dist:/usr/share/nginx/html:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
