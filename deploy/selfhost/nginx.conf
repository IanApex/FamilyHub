server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # HSTS is deliberately absent: Tailscale terminates TLS on the host and
    # this server only ever receives plaintext over loopback.
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml application/manifest+json;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Every request arrives via the Funnel's HTTPS listener, so this is
        # always https even though this hop itself is plaintext.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Cache rules use `expires` rather than `add_header Cache-Control`: an
    # add_header inside a location discards the security headers inherited
    # from the server block.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location = /sw.js {
        expires epoch;
    }

    location = /index.html {
        expires epoch;
    }

    location = /manifest.webmanifest {
        expires epoch;
    }

    # SPA fallback. Required for real paths like /settings, which the Google
    # OAuth flow redirects back to.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
